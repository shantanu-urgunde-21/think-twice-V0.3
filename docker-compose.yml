services:
  postgres:
    # Profile: only starts when explicitly requested with --profile local
    # Used for local development without RDS.
    # On EC2, DATABASE_URL in backend/.env points to RDS — no container needed.
    profiles: [local]
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # On EC2:  BACKEND_IMAGE=ghcr.io/<owner>/think-twice-backend:<sha>
    # Locally: BACKEND_IMAGE=think-twice-backend-local (after `docker build -t think-twice-backend-local ./backend`)
    image: ${BACKEND_IMAGE:-think-twice-backend-local}
    container_name: game_theory_backend
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # skipped when postgres profile is not active (i.e. on EC2)
    restart: unless-stopped

volumes:
  postgres_data:
