# CI/CD pipeline for Think Twice (roadmap Phase 2 — internaldocs/Think_Twice_MLOps_Roadmap_v3.md).
#
# Jobs:
#   test            - always. Runs the backend pytest suite and a frontend production build.
#   build-and-push  - on push only. Builds the backend Docker image and pushes it to GHCR,
#                      tagged with both the commit SHA and `latest`.
#   deploy          - on push to `main` only. SSHes into EC2, runs the new backend image as a
#                      Docker container (replacing the old systemd+venv process), and atomically
#                      swaps in the newly built frontend/dist.
#
# --- One-time setup required before `deploy` can run ---
#
# 1) GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#      EC2_HOST       - Elastic IP or hostname of the EC2 instance
#      EC2_SSH_USER    - SSH user (e.g. ubuntu)
#      EC2_SSH_KEY     - private key (PEM) matching a public key already in the box's
#                        ~/.ssh/authorized_keys
#
# 2) GHCR package visibility: after the first successful `build-and-push` run, open the new
#    package under the repo's Packages tab and set it to Public. This lets EC2 `docker pull`
#    without extra registry credentials. (If you'd rather keep it private, add a PAT with
#    `read:packages` scope on the box and `docker login ghcr.io` once, manually.)
#
# 3) EC2 prerequisites (one-time, manual):
#      - Docker installed and the deploy user able to run `docker` (in the `docker` group).
#      - backend/.env present at APP_DIR/backend/.env with the same production values
#        (DATABASE_URL, SECRET_KEY, ADMIN_USERNAME, ADMIN_PASSWORD, FRONTEND_URL, ...)
#        currently used by the systemd service.
#      - Stop and disable the old systemd service so it can't fight the container for port 8000:
#          sudo systemctl stop think-twice-backend
#          sudo systemctl disable think-twice-backend
#      - Nginx needs no changes: it already proxies /api/ to 127.0.0.1:8000 and serves
#        frontend/dist as static files, regardless of what process is listening there.
#
# APP_DIR below must match the path already used in nginx/think-twice.conf's `root` directive.

name: CI/CD

on:
  push:
    branches: [ec2-deployment]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: think-twice-backend
  APP_DIR: /home/ubuntu/think-twice-V0.3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set image reference
        id: image
        run: echo "full=ghcr.io/${{ steps.owner.outputs.lc }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.full }}:${{ github.sha }}
            ${{ steps.image.outputs.full }}:latest

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/ec2-deployment' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy backend via docker compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            git pull origin ec2-deployment   # keeps docker-compose.yml + nginx/think-twice.conf in sync
            # Reload nginx if its config changed in this push
            if git diff HEAD@{1} HEAD --name-only | grep -q '^nginx/'; then
              echo "nginx config changed — reloading"
              sudo nginx -t && sudo systemctl reload nginx
            fi
            export BACKEND_IMAGE="${{ needs.build-and-push.outputs.image }}:${{ github.sha }}"
            docker compose pull backend
            docker compose up -d --no-deps backend
            # Health check with retries — /health returns {"status": "healthy"}
            for i in $(seq 1 10); do
              if curl -sf http://127.0.0.1:8000/health > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Attempt $i/10 failed, retrying in 3s..."
              sleep 3
            done
            echo "Health check failed after 10 attempts" && exit 1

      - name: Prepare remote frontend upload directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            rm -rf ${{ env.APP_DIR }}/frontend/dist_new
            mkdir -p ${{ env.APP_DIR }}/frontend/dist_new

      - name: Upload new frontend build
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "${{ env.APP_DIR }}/frontend/dist_new"
          strip_components: 1

      - name: Atomically swap in new frontend build
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}/frontend
            rm -rf dist_old
            mv dist dist_old 2>/dev/null || true
            mv dist_new dist
            rm -rf dist_old

      - name: Smoke test public endpoint
        run: curl -sf "http://${{ secrets.EC2_HOST }}/" > /dev/null
