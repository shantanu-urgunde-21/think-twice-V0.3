<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2/3 of Average - Think Twice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>2/3 of Average Game</h1>
        <div id="headerControls">
          <span
            id="playerDisplay"
            style="margin-right: 15px; color: #333"
          ></span>
          <button
            id="logoutPlayerBtn"
            onclick="logoutPlayer()"
            style="display: none; margin-right: 10px; background: #6c757d"
          >
            Logout
          </button>
          <button
            id="adminLoginBtn"
            onclick="showAdminLogin()"
            class="admin-toggle-btn"
          >
            Admin
          </button>
          <button
            id="adminLogoutBtn"
            onclick="logoutAdmin()"
            class="admin-toggle-btn"
            style="display: none"
          >
            Admin Logout
          </button>
        </div>
      </header>

      <!-- Admin Login Modal -->
      <div id="adminLoginModal" class="modal" style="display: none">
        <div class="modal-content">
          <span class="close" onclick="closeAdminLogin()">&times;</span>
          <h2>Admin Login</h2>
          <form id="adminLoginForm">
            <input
              type="text"
              id="adminUsername"
              placeholder="Username"
              required
            />
            <input
              type="password"
              id="adminPassword"
              placeholder="Password"
              required
            />
            <button type="submit">Login</button>
          </form>
          <div id="adminLoginError" class="error" style="display: none"></div>
        </div>
      </div>

      <!-- Main Game -->
      <section id="twoThirdsGame" class="section">
        <h2>Game Rules</h2>
        <p>
          Each player guesses a number (0-100). Winner is closest to 2/3 of the
          average. Winner gets 10 points, others get 1 point for participation.
        </p>

        <form id="twoThirdsForm">
          <label>Your Guess (0-100):</label>
          <input type="number" id="twoThirdsGuess" min="0" max="100" required />
          <button type="submit">Submit Guess</button>
        </form>

        <div id="twoThirdsWaiting" style="display: none">
          <p>Waiting for other players...</p>
          <p>Submissions: <span id="submissionCount">0</span></p>
          <div class="admin-action" style="display: none; margin-top: 15px">
            <button onclick="calculateTwoThirds()" class="admin-btn">
              Calculate Results
            </button>
            <button
              onclick="closeGame()"
              class="admin-btn"
              style="background: #dc3545; margin-left: 10px"
            >
              Close Game
            </button>
          </div>
        </div>

        <div id="twoThirdsResults" style="display: none"></div>
        <button onclick="backToHome()" class="back-btn">Back to Home</button>
      </section>

      <!-- Admin Panel -->
      <section id="adminPanel" class="section" style="display: none">
        <h2>Admin Controls</h2>
        <div class="admin-controls">
          <div class="admin-control-group">
            <h3>Game Management</h3>
            <button onclick="startTwoThirdsGameAdmin()" class="admin-btn">
              Start New Game
            </button>
            <button onclick="loadGameStats()" class="admin-btn">
              View Game Stats
            </button>
          </div>
          <div id="adminStats"></div>
        </div>
      </section>
    </div>

    <div id="notification" class="notification"></div>

    <script>
      const API_URL = (() => {
        if (window.BACKEND_URL) return window.BACKEND_URL;
        if (window.location.hostname === "localhost")
          return "http://localhost:8000/api";
        return "https://think-twice-v03-production.up.railway.app/api";
      })();

      let currentPlayer = null;
      let currentGameId = null;
      let adminToken = localStorage.getItem("adminToken");
      let isAdmin = false;

      document.addEventListener("DOMContentLoaded", () => {
        checkAdminStatus();

        const savedPlayer = localStorage.getItem("currentPlayer");
        if (savedPlayer) {
          currentPlayer = JSON.parse(savedPlayer);
          updatePlayerDisplay();
        } else {
          window.location.href = "index.html";
          return;
        }

        document
          .getElementById("twoThirdsForm")
          .addEventListener("submit", submitTwoThirdsGuess);
        document
          .getElementById("adminLoginForm")
          ?.addEventListener("submit", handleAdminLogin);

        startTwoThirdsGameUI();
        setInterval(updateSubmissionCount, 3000); // Auto-refresh every 3s
      });

      async function apiCall(endpoint, method = "GET", data = null) {
        const options = {
          method,
          headers: { "Content-Type": "application/json" },
        };
        if (adminToken)
          options.headers["Authorization"] = `Bearer ${adminToken}`;
        if (data) options.body = JSON.stringify(data);

        const response = await fetch(`${API_URL}${endpoint}`, options);
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.detail || "API call failed");
        }
        return response.json();
      }

      function updatePlayerDisplay() {
        if (currentPlayer) {
          document.getElementById("playerDisplay").textContent =
            `Playing as: ${currentPlayer.name}`;
          document.getElementById("logoutPlayerBtn").style.display =
            "inline-block";
        }
      }

      function logoutPlayer() {
        localStorage.removeItem("currentPlayer");
        window.location.href = "index.html";
      }

      function backToHome() {
        window.location.href = "index.html";
      }

      async function startTwoThirdsGameUI() {
        try {
          let game;
          try {
            game = await apiCall("/games/two-thirds/active");
          } catch (e) {
            game = null;
          }

          if (!game) {
            document.getElementById("twoThirdsForm").style.display = "none";
            document.getElementById("twoThirdsWaiting").innerHTML =
              "<p>No active game. Admin needs to start the game.</p>";
            document.getElementById("twoThirdsWaiting").style.display = "block";
            return;
          }

          currentGameId = game.id;
          const round = await apiCall(
            `/games/two-thirds/${game.id}/current-round`,
          );
          document.getElementById("submissionCount").textContent =
            round.submissions_count;

          document.getElementById("twoThirdsForm").style.display = "block";
          document.getElementById("twoThirdsWaiting").style.display = "none";
        } catch (error) {
          console.error("Error:", error);
          document.getElementById("twoThirdsWaiting").innerHTML =
            `<p>Error: ${error.message}</p>`;
          document.getElementById("twoThirdsWaiting").style.display = "block";
        }
      }

      async function submitTwoThirdsGuess(e) {
        e.preventDefault();
        const guess = parseInt(document.getElementById("twoThirdsGuess").value);

        try {
          await apiCall(`/games/two-thirds/${currentGameId}/submit`, "POST", {
            player_id: currentPlayer.id,
            guess,
          });

          document.getElementById("twoThirdsForm").reset();
          document.getElementById("twoThirdsForm").style.display = "none";
          document.getElementById("twoThirdsWaiting").style.display = "block";
          showNotification("Guess submitted! Waiting for others...", "success");
        } catch (error) {
          showNotification(error.message, "error");
        }
      }

      async function updateSubmissionCount() {
        if (!currentGameId) return;
        try {
          const round = await apiCall(
            `/games/two-thirds/${currentGameId}/current-round`,
          );
          document.getElementById("submissionCount").textContent =
            round.submissions_count;
        } catch (error) {
          console.error("Error updating count:", error);
        }
      }

      async function calculateTwoThirds() {
        try {
          const result = await apiCall(
            `/games/two-thirds/${currentGameId}/calculate`,
            "POST",
          );

          let html = `<div class="result-box">
      <h3>Results</h3>
      <p><strong>Average:</strong> ${result.average.toFixed(2)}</p>
      <p><strong>2/3 of Average:</strong> ${result.two_thirds_average.toFixed(2)}</p>
      <p class="success"><strong>Winner:</strong> ${result.winner_name}</p>
      <h4>All Guesses:</h4>
      <table class="leaderboard-table">
        <thead><tr><th>Player</th><th>Guess</th><th>Distance</th><th>Points</th></tr></thead>
        <tbody>`;

          result.all_guesses.forEach((g) => {
            html += `<tr><td>${g.player_name}</td><td>${g.guess}</td><td>${g.distance.toFixed(2)}</td><td><strong>${g.points}</strong></td></tr>`;
          });

          html += `</tbody></table></div>`;
          document.getElementById("twoThirdsResults").innerHTML = html;
          document.getElementById("twoThirdsWaiting").style.display = "none";
          document.getElementById("twoThirdsResults").style.display = "block";
        } catch (error) {
          showNotification(error.message, "error");
        }
      }

      async function closeGame() {
        if (
          !confirm("Close this game? Players won't be able to submit anymore.")
        )
          return;

        try {
          await apiCall(`/games/two-thirds/${currentGameId}/close`, "POST");
          showNotification("Game closed successfully", "success");
          setTimeout(() => (window.location.href = "index.html"), 2000);
        } catch (error) {
          showNotification(error.message, "error");
        }
      }

      async function startTwoThirdsGameAdmin() {
        if (!isAdmin) {
          showNotification("Admin access required", "error");
          return;
        }

        try {
          await apiCall("/games/two-thirds/start", "POST");
          showNotification("Game started!", "success");
          setTimeout(() => location.reload(), 1000);
        } catch (error) {
          showNotification(error.message, "error");
        }
      }

      async function loadGameStats() {
        if (!currentGameId) {
          showNotification("No active game", "error");
          return;
        }

        try {
          const stats = await apiCall(`/admin/game-stats/${currentGameId}`);
          let html =
            "<div class='admin-control-group'><h3>Game Statistics</h3>";

          stats.rounds.forEach((round) => {
            html += `<div style="background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 5px;">
        <h4>Round ${round.round_number} (${round.status})</h4>`;

            if (round.submissions && round.submissions.length > 0) {
              html += `<table class="leaderboard-table">
          <thead><tr><th>Player</th><th>Guess</th><th>Total Score</th></tr></thead>
          <tbody>`;

              round.submissions.forEach((sub) => {
                html += `<tr><td>${sub.player_name}</td><td>${sub.guess}</td><td>${sub.score}</td></tr>`;
              });

              html += `</tbody></table>`;
            }
            html += `</div>`;
          });

          html += "</div>";
          document.getElementById("adminStats").innerHTML = html;
        } catch (error) {
          showNotification(error.message, "error");
        }
      }

      // Admin Auth
      function showAdminLogin() {
        document.getElementById("adminLoginModal").style.display = "block";
      }

      function closeAdminLogin() {
        document.getElementById("adminLoginModal").style.display = "none";
        document.getElementById("adminUsername").value = "";
        document.getElementById("adminPassword").value = "";
      }

      async function handleAdminLogin(e) {
        e.preventDefault();
        const username = document.getElementById("adminUsername").value;
        const password = document.getElementById("adminPassword").value;

        try {
          const response = await fetch(
            `${API_URL.replace("/api", "")}/api/auth/login`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            },
          );

          if (!response.ok) throw new Error("Invalid credentials");

          const data = await response.json();
          adminToken = data.access_token;
          localStorage.setItem("adminToken", adminToken);
          isAdmin = true;

          updateAdminUI();
          closeAdminLogin();
          showNotification("Admin login successful!", "success");
        } catch (error) {
          document.getElementById("adminLoginError").textContent =
            error.message;
          document.getElementById("adminLoginError").style.display = "block";
        }
      }

      function logoutAdmin() {
        adminToken = null;
        isAdmin = false;
        localStorage.removeItem("adminToken");
        updateAdminUI();
        showNotification("Logged out", "info");
      }

      async function checkAdminStatus() {
        if (!adminToken) {
          updateAdminUI();
          return;
        }

        try {
          const response = await fetch(
            `${API_URL.replace("/api", "")}/api/auth/verify`,
            {
              headers: { Authorization: `Bearer ${adminToken}` },
            },
          );

          if (response.ok) {
            isAdmin = true;
          } else {
            logoutAdmin();
            return;
          }
        } catch (error) {
          logoutAdmin();
          return;
        }

        updateAdminUI();
      }

      function updateAdminUI() {
        document.getElementById("adminLoginBtn").style.display = isAdmin
          ? "none"
          : "inline-block";
        document.getElementById("adminLogoutBtn").style.display = isAdmin
          ? "inline-block"
          : "none";
        document.getElementById("adminPanel").style.display = isAdmin
          ? "block"
          : "none";

        document.querySelectorAll(".admin-action").forEach((el) => {
          el.style.display = isAdmin ? "block" : "none";
        });
      }

      function showNotification(message, type = "info") {
        const notification = document.getElementById("notification");
        notification.textContent = message;
        notification.className = `notification ${type} show`;
        setTimeout(() => notification.classList.remove("show"), 3000);
      }
    </script>
  </body>
</html>
