<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Think Twice - Game Theory Platform</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <div class="header-content">
          <h1>Think Twice</h1>
          <div
            id="stats"
            style="margin-top: 10px; font-size: 0.9em; color: #666"
          >
            <!-- <span>Players: <strong id="playerCount">0</strong></span>
            <span style="margin: 0 10px">|</span>
            <span>Active Games: <strong id="activeGames">0</strong></span> -->
          </div>
        </div>

        <div id="headerControls">
          <button
            id="adminLoginBtn"
            onclick="showAdminLogin()"
            class="admin-toggle-btn"
          >
            Admin Login
          </button>
          <button
            id="adminLogoutBtn"
            onclick="logoutAdmin()"
            class="admin-toggle-btn"
            style="display: none"
          >
            Admin Logout
          </button>
        </div>
      </header>

      <!-- Admin Login Modal -->
      <div id="adminLoginModal" class="modal" style="display: none">
        <div class="modal-content">
          <span class="close" onclick="closeAdminLogin()">&times;</span>
          <h2>Admin Login</h2>
          <form id="adminLoginForm">
            <input
              type="text"
              id="adminUsername"
              placeholder="Username"
              required
              autocomplete="username"
            />
            <input
              type="password"
              id="adminPassword"
              placeholder="Password"
              required
              autocomplete="current-password"
            />
            <button type="submit">Login</button>
          </form>
          <div id="adminLoginError" class="error" style="display: none"></div>
        </div>
      </div>

      <!-- Home View (Player Registration + Leaderboard) -->
      <div id="homeView">
        <!-- Player Registration -->
        <section id="registration" class="section">
          <h2>Player Registration</h2>
          <form id="registerForm">
            <input
              type="text"
              id="playerName"
              placeholder="Enter your name"
              required
            />
            <button type="submit">Register</button>
          </form>
          <div id="playerSelect" style="margin-top: 20px; display: none">
            <label>Or select existing player:</label>
            <select id="existingPlayers">
              <option value="">Choose player...</option>
            </select>
            <button onclick="selectPlayer()">Select</button>
          </div>
          <div id="currentPlayer" style="display: none; margin-top: 20px">
            <p>Playing as: <strong id="currentPlayerName"></strong></p>
            <button onclick="logout()">Change Player</button>
          </div>
        </section>

        <!-- Leaderboard (Only on home page) -->
        <section id="leaderboard" class="section">
          <h2>Leaderboard</h2>
          <div id="leaderboardContent"></div>
        </section>

        <!-- Game Selection -->
        <section id="gameSelection" class="section" style="display: none">
          <h2>Select a Game</h2>
          <div class="game-buttons">
            <a href="two-thirds-game.html" class="game-btn">2/3 of Average</a>
            <a href="horse-race-game.html" class="game-btn">Horse Racing</a>
          </div>
        </section>
      </div>

      <!-- Admin Panel (Only visible when logged in as admin) -->
      <section id="adminPanel" class="section" style="display: none">
        <h2>Admin Controls</h2>
        <div class="admin-controls">
          <div class="admin-control-group">
            <h3>Game Visibility Settings</h3>
            <div id="gameSettingsPanel"></div>
          </div>
          <div class="admin-control-group">
            <h3>Game Management</h3>
            <button onclick="startTwoThirdsGameAdmin()" class="admin-btn">
              Start Two-Thirds Game
            </button>
          </div>
          <div class="admin-control-group">
            <h3>Player Management</h3>
            <div id="playerManagement"></div>
          </div>
        </div>
      </section>
    </div>

    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
  </body>
</html>
